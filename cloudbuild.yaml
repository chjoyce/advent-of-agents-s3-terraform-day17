steps:

# ============================================================
# 1. Create foundation infrastructure (VPC, Agent Gateways,
#    Model Armor templates, Authz Extensions & Policies)
# ============================================================

- name: hashicorp/terraform:1.13
  id: terraform-foundation
  entrypoint: sh
  args:
    - -c
    - |
      set -e

      cd terraform/foundation

      terraform init -reconfigure \
        -backend-config="bucket=${_TF_BUCKET}" \
        -backend-config="prefix=foundation"

      terraform apply \
        -auto-approve \
        -var="project_id=${PROJECT_ID}" \
        -var="region=${_REGION}"

      # Save outputs so the runtime phase can bind the Agent Runtime to the Gateways.
      terraform output -raw ingress_gateway_id > /workspace/ingress_gateway_id
      terraform output -raw egress_gateway_id > /workspace/egress_gateway_id


# ============================================================
# 2. Build the agent container
# ============================================================

- name: gcr.io/cloud-builders/docker
  id: build-agent
  waitFor:
    - terraform-foundation
  args:
    - build
    - -t
    - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/agent-images/demo-agent:${BUILD_ID}
    - ./agent


# ============================================================
# 3. Push the container to Artifact Registry
# ============================================================

- name: gcr.io/cloud-builders/docker
  id: push-agent
  waitFor:
    - build-agent
  args:
    - push
    - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/agent-images/demo-agent:${BUILD_ID}


# ============================================================
# 4. Deploy/update Agent Runtime with Terraform
# ============================================================

- name: hashicorp/terraform:1.13
  id: terraform-runtime
  waitFor:
    - push-agent
  entrypoint: sh
  args:
    - -c
    - |
      set -e

      cd terraform/runtime

      # Pass foundation outputs into runtime Terraform.
      cat > runtime.auto.tfvars <<EOF
      project_id = "${PROJECT_ID}"
      project_number = "${PROJECT_NUMBER}"
      region = "${_REGION}"
      image_tag = "${BUILD_ID}"
      repository_name = "agent-images"
      ingress_gateway_id = "$(cat /workspace/ingress_gateway_id)"
      egress_gateway_id = "$(cat /workspace/egress_gateway_id)"
      EOF

      terraform init -reconfigure \
        -backend-config="bucket=${_TF_BUCKET}" \
        -backend-config="prefix=runtime"

      terraform apply \
        -auto-approve


substitutions:
  _REGION: us-central1
  _TF_BUCKET: ${PROJECT_ID}-terraform-state


options:
  logging: CLOUD_LOGGING_ONLY
