steps:

# ============================================================
# 1. Plan foundation infrastructure (Pull Request verification)
# ============================================================

- name: hashicorp/terraform:1.13
  id: terraform-foundation-plan
  entrypoint: sh
  args:
    - -c
    - |
      set -e
      cd terraform/foundation

      terraform init \
        -backend-config="bucket=${_TF_BUCKET}" \
        -backend-config="prefix=agent-demo/foundation"

      terraform validate
      terraform plan \
        -var="project_id=${PROJECT_ID}" \
        -var="region=${_REGION}"


# ============================================================
# 2. Plan runtime infrastructure (Pull Request verification)
# ============================================================

- name: hashicorp/terraform:1.13
  id: terraform-runtime-plan
  waitFor:
    - terraform-foundation-plan
  entrypoint: sh
  args:
    - -c
    - |
      set -e
      cd terraform/runtime

      terraform init \
        -backend-config="bucket=${_TF_BUCKET}" \
        -backend-config="prefix=agent-demo/runtime"

      terraform validate
      terraform plan \
        -var="project_id=${PROJECT_ID}" \
        -var="project_number=${PROJECT_NUMBER}" \
        -var="region=${_REGION}" \
        -var="image_tag=${SHORT_SHA}" \
        -var="repository_name=agent-images" \
        -var="ingress_gateway_id=projects/${PROJECT_ID}/locations/${_REGION}/agentGateways/agent-demo-ingress" \
        -var="egress_gateway_id=projects/${PROJECT_ID}/locations/${_REGION}/agentGateways/agent-demo-egress"

substitutions:
  _REGION: us-central1
  _TF_BUCKET: ${PROJECT_ID}-terraform-state

options:
  logging: CLOUD_LOGGING_ONLY
