# ==============================================================================
# Advent of Agents S3 (Day 17) — Pull Request Dry-Run Pipeline (cloudbuild-pr.yaml)
# Verifies Docker Build + Runs Terraform Plan on Foundation & Runtime (No Apply!)
# ==============================================================================

substitutions:
  _REGION: "us-central1"
  _REPO_NAME: "agent-repo"
  _AGENT_NAME: "day17-adk-ops-agent"
  _IMAGE_TAG: "pr-preview"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Verify the Single ADK Agent Dockerfile Builds Cleanly
  - id: "verify-docker-build"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_AGENT_NAME}:${_IMAGE_TAG}"
      - "."

  # 2. Validate & Plan Foundation Infrastructure (Dry-Run Only)
  - id: "terraform-foundation-plan"
    name: "hashicorp/terraform:1.9"
    dir: "terraform/foundation"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        set -e
        terraform fmt -check
        terraform init \
          -backend-config="bucket=${PROJECT_ID}-terraform-state" \
          -backend-config="prefix=agent-demo/foundation"
        terraform plan \
          -var="project_id=${PROJECT_ID}" \
          -var="region=${_REGION}" \
          -var="repository_name=${_REPO_NAME}"

  # 3. Validate & Plan Agent Runtime Provisioning (Dry-Run Only)
  - id: "terraform-runtime-plan"
    name: "hashicorp/terraform:1.9"
    dir: "terraform/runtime"
    waitFor: ["terraform-foundation-plan"]
    entrypoint: "sh"
    args:
      - "-c"
      - |
        set -e
        terraform fmt -check
        terraform init \
          -backend-config="bucket=${PROJECT_ID}-terraform-state" \
          -backend-config="prefix=agent-demo/runtime"
        terraform plan \
          -var="project_id=${PROJECT_ID}" \
          -var="region=${_REGION}" \
          -var="repository_name=${_REPO_NAME}" \
          -var="agent_name=${_AGENT_NAME}" \
          -var="image_tag=${_IMAGE_TAG}"
